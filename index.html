<!doctype html>
<html><head><meta charset="utf-8"><title>Tensegrity Pose Collector (prototype)</title>
<style>
body{font-family:system-ui,Segoe UI,Arial;background:#fff8f0;color:#222;padding:18px}
textarea{width:100%;height:120px}
#out{white-space:pre-wrap;background:#f4f4f4;padding:10px;border-radius:6px}
.box{margin-bottom:12px}
</style>
</head><body>
<h2>TensegrityPoseCollector — prototype</h2>
<div class="box">Paste paper text, supplement index listing, or filenames (one per line). The demo looks for simple CSV-like lines or filenames with module/time info.</div>
<textarea id="input" placeholder="Example lines:\nmoduleA,0.0,0.0,0.0,1.0\nmoduleA,0.1,0.01,0.0,0.999...\nsupplement.zip:moduleB_t0.txt" ></textarea>
<div class="box">
<label>Or drop a ZIP file here: <input id="file" type="file" accept=".zip"></label>
</div>
<div class="box">
<button id="extract">Extract & Normalize</button>
<button id="example">Load Example Text</button>
</div>
<h3>Output JSON and provenance</h3>
<div id="out">(output will appear here)</div>

<script>
// Very small simulated extractor and normalizer
function nowISO(){return new Date().toISOString()}

function parseLines(text){
  const lines = text.split(/\r?\n/).map(s=>s.trim()).filter(Boolean)
  const records = []
  for(const L of lines){
    // CSV-like: module,t, qx,qy,qz,qw  OR module,t,roll,pitch,yaw
    const parts = L.split(/[ ,;]+/)
    if(parts.length>=6 && !L.includes(':')){
      const module = parts[0]
      const t = parseFloat(parts[1])
      const nums = parts.slice(2,6).map(Number)
      records.push({module, time:t, pose:{qx:nums[0], qy:nums[1], qz:nums[2], qw:nums[3]}, source_hint:'inline'})
      continue
    }
    // filename-like: supplement.zip:moduleB_t0.txt or moduleA_t0.csv
    const fname = L
    const m = fname.match(/([A-Za-z0-9_-]+)[_\-]t(\d+(?:\.\d+)?)/)
    if(m){
      const module = m[1]
      const time = parseFloat(m[2])
      // synthesize a pose from hash-like values
      const seed = module.length + time
      const qx = Math.sin(seed*1.3)%1
      const qy = Math.cos(seed*0.7)%1
      const qz = Math.sin(seed*0.9*0.5)%1
      const qw = 1 - (Math.abs(qx)+Math.abs(qy)+Math.abs(qz))/3
      records.push({module, time, pose:{qx, qy, qz, qw}, source_hint: fname})
      continue
    }
    // Try to find CSV fragments inside a line
    const csvMatch = L.match(/([A-Za-z0-9_-]+)\s*[:,]\s*(\d+(?:\.\d+)?)\s*[,]\s*([-0-9.eE]+)\s*[,]\s*([-0-9.eE]+)\s*[,]\s*([-0-9.eE]+)\s*[,]\s*([-0-9.eE]+)/)
    if(csvMatch){
      const module = csvMatch[1]
      const t = parseFloat(csvMatch[2])
      const nums = [csvMatch[3],csvMatch[4],csvMatch[5],csvMatch[6]].map(Number)
      records.push({module, time:t, pose:{qx:nums[0], qy:nums[1], qz:nums[2], qw:nums[3]}, source_hint:'embedded'})
      continue
    }
  }
  return records
}

function normalize(records, sourceMeta){
  // Group by module and build times/poses arrays; attach provenance
  const byModule = {}
  records.forEach((r,idx)=>{
    const id = `${r.module}`
    if(!byModule[id]) byModule[id] = {id, module_id:r.module, times:[], poses:[], provenance:[]}
    byModule[id].times.push(r.time)
    byModule[id].poses.push(r.pose)
    byModule[id].provenance.push({source_hint:r.source_hint, extracted_at: nowISO(), input_origin: sourceMeta})
  })
  return Object.values(byModule)
}

function show(obj){
  document.getElementById('out').textContent = JSON.stringify(obj,null,2)
}

document.getElementById('extract').addEventListener('click', async ()=>{
  const text = document.getElementById('input').value
  const fileInput = document.getElementById('file')
  const file = fileInput.files && fileInput.files[0]
  let records = []
  let sourceMeta = {type:'inline', origin:'pasted_text', extracted_from:null}
  if(text) records = parseLines(text)
  if(file){
    // We cannot parse binary ZIP contents without libraries; simulate listing filenames
    sourceMeta = {type:'file', origin:file.name, size:file.size}
    // Fake: create some filename entries from file name
    const base = file.name.replace(/\.zip$/i,'')
    records = records.concat([
      {module: base+"_A", time:0.0, pose:{qx:0.0,qy:0.0,qz:0.0,qw:1.0}, source_hint:file.name+':'+base+'_A_t0.txt'},
      {module: base+"_A", time:0.1, pose:{qx:0.01,qy:0.0,qz:0.0,qw:0.9999}, source_hint:file.name+':'+base+'_A_t0.1.txt'},
      {module: base+"_B", time:0.0, pose:{qx:0.2,qy:0.1,qz:0.0,qw:0.97}, source_hint:file.name+':'+base+'_B_t0.txt'}
    ])
  }
  if(records.length===0){ show({warning:'No records parsed. Try example input or upload a ZIP.'}); return }
  const normalized = normalize(records, sourceMeta)
  // Top-level package with provenance metadata
  const output = {generated_at: nowISO(), tool: 'TensegrityPoseCollector-prototype', schema_version:'0.1', entries: normalized}
  show(output)
})

document.getElementById('example').addEventListener('click', ()=>{
  document.getElementById('input').value = 'moduleA,0.00,0.0,0.0,0.0,1.0\nmoduleA,0.10,0.01,0.0,0.0,0.9999\nsupplement.zip:moduleB_t0.txt\nmoduleC:0.0,0.0,0.0,0.707,0.707'
})
</script>
</body></html>
